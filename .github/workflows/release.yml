name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: false
        default: "0.0.0-dev"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Write Signing.xcconfig
        run: |
          # This fork builds unsigned archives; the app is ad-hoc signed afterwards
          # so it can be redistributed as a plain artifact. No Apple Developer
          # certificate or Sparkle EdDSA key is required.
          cat > Configurations/Signing.xcconfig << EOF
          MOEPEEK_CODE_SIGN_STYLE = Manual
          MOEPEEK_CODE_SIGN_IDENTITY = -
          MOEPEEK_DEVELOPMENT_TEAM =
          EOF

      - name: Resolve dependencies and generate project
        run: tuist install && tuist generate

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -workspace MoePeek.xcworkspace \
            -scheme MoePeek \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            MACOSX_DEPLOYMENT_TARGET=12.0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace MoePeek.xcworkspace \
            -scheme MoePeek \
            -configuration Release \
            -archivePath build/MoePeek.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            VALIDATE_STRINGS_FILES_WHILE_COPYING=NO \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Ad-hoc sign app bundle
        run: |
          APP="build/MoePeek.xcarchive/Products/Applications/MoePeek.app"
          # Ad-hoc signature keeps TCC grants tied to a stable identity per build and
          # satisfies Sparkle/XPC integrity checks. Gatekeeper still flags downloads;
          # users run `xattr -cr MoePeek.app` before first launch (see README).
          codesign --force --deep --sign - "$APP"
          codesign --verify --strict "$APP"

      - name: Prepare app bundle
        run: |
          mkdir -p build/app
          cp -R build/MoePeek.xcarchive/Products/Applications/MoePeek.app build/app/

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/app/MoePeek.app \
            "MoePeek-v${{ steps.version.outputs.version }}-macOS12-13.zip"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "MoePeek" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "MoePeek.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "MoePeek.app" \
            "MoePeek-v${{ steps.version.outputs.version }}-macOS12-13.dmg" \
            build/app/ \
            || test $? -eq 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            MoePeek-v${{ steps.version.outputs.version }}-macOS12-13.zip
            MoePeek-v${{ steps.version.outputs.version }}-macOS12-13.dmg
